<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="./" aria-label="DEEPAM home"><span class="mark" aria-hidden="true">✦</span><span><span class="wordmark">DEEPAM</span><br><span class="micro">The living rangoli</span></span></a>
    </header>
    <main class="workspace">
      <section class="preview-area" aria-label="Live greeting card preview">
        <div class="card-frame"><div id="cardStage" class="card-stage is-lit" role="img" aria-label="Happy Diwali greeting card with an intricate rangoli and glowing diyas"><svg id="artwork" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" aria-hidden="true"></svg><canvas class="fx-canvas" id="fxCanvas" aria-hidden="true"></canvas></div></div>
      </section>
      <aside class="studio" aria-label="Festival canvas and color stories">
        <div class="studio-hd"><h2>Festival canvas</h2><span class="counter" id="designCounter">01 / 10</span></div>
        <button class="surprise" id="randomBtn" type="button" aria-label="Surprise me with a new rangoli and colors"><span><strong>✺ Surprise me</strong><small>Try this! Fresh patterns and colors in one tap</small></span><span class="sparkle" aria-hidden="true">✧</span></button>
        <div class="field-label"><span>Explore rangolis</span><span class="label-note">Swipe to choose ↔</span></div>
        <div id="templateScroller" class="templates" aria-label="Rangoli designs"></div>
        <div class="field-label"><span>Color stories</span><span class="label-note" id="paletteName">Heritage glow</span></div>
        <div id="paletteList" class="palette-scroll" aria-label="Color palettes"></div>
        <div class="btnrow"><button class="btn" id="downloadBtn" type="button">↓ Save card</button><button class="btn primary" id="shareBtn" type="button">↗ Share greeting</button></div>
      </aside>
    </main>
  </div>
  <div class="toaster" id="toast" role="status" aria-live="polite"></div>
  <script type="module">

    const state={design:0,palette:0,colors:{...PALETTES[0]},lit:true};
    const $=id=>document.getElementById(id);const safe=(s)=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
    const rad=d=>d*Math.PI/180,pt=(r,a)=>[r*Math.cos(rad(a)),r*Math.sin(rad(a))];
    const circle=(x,y,r,fill,more='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${more}/>`;
    const path=(d,fill,stroke='',width=0,more='')=>`<path d="${d}" fill="${fill}" ${stroke?`stroke="${stroke}" stroke-width="${width}" stroke-linejoin="round"`:''} ${more}/>`;
    const ring=(r,stroke,width=5,dash='')=>circle(0,0,r,'none',`stroke="${stroke}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''}`);
    const petal=(inner,outer,width,fill,outline,inset=0)=>{
      let d=`M 0 ${-inner} C ${-width*.78} ${-inner-35} ${-width*.72} ${-outer+36} 0 ${-outer} C ${width*.72} ${-outer+36} ${width*.78} ${-inner-35} 0 ${-inner} Z`;
      let mid=`M 0 ${-inner-5} Q ${width*.13} ${-(inner+outer)/2} 0 ${-outer+19}`;
      return path(d,fill,outline,7)+path(mid,'none',outline,2.7,'opacity=".7"');
    };
    const angleRing=(count,fn,offset=0)=>Array.from({length:count},(_,i)=>`<g transform="rotate(${(i*360/count+offset).toFixed(3)})">${fn(i)}</g>`).join('');
    const beadRing=(r,n,color,size=5)=>angleRing(n,()=>circle(0,-r,size,color));
    const curls=(r,n,color)=>angleRing(n,()=>path(`M -10 ${-r+18} Q -32 ${-r-13} -2 ${-r-22} Q 17 ${-r-28} 9 ${-r-8} Q 3 ${-r+4} -8 ${-r-5}`,'none',color,4));

    const florets=(r,n,color)=>angleRing(n,()=>`<g transform="translate(0 ${-r})">${angleRing(6,()=>path('M 0 -6 Q -10 -18 0 -30 Q 10 -18 0 -6 Z',color,''))}${circle(0,0,5,'#f9d278')}</g>`);
    // A hand-drawn but mathematically symmetric geometry engine. All rotations equal 360/n degrees.
    function makeMotif(kind,c){
      const W=c.border,A=c.accent,P=c.petal,L=c.leaf;let s='';

        s+=angleRing(12,()=>petal(51,125,32,P,W));
      }else if(kind==='petal'){
        s+=angleRing(6,i=>petal(65,248,111,i%2?A:P,W));

        s+=ring(80,W,8)+beadRing(84,28,A,5)+curls(240,6,W);
      }else if(kind==='diya'){
        s+=ring(243,A,15)+ring(223,W,5);
        s+=angleRing(8,i=>petal(122,278,70,i%2?P:A,W),22.5);
        s+=angleRing(8,()=>petal(71,161,42,L,W));
        s+=ring(83,A,10)+beadRing(95,32,W,6);
      }else if(kind==='royal'){
        s+=angleRing(10,i=>petal(135,277,64,i%2?P:L,W));
        s+=angleRing(10,()=>petal(132,217,39,A,W),18);
        s+=ring(128,A,15)+ring(110,W,7)+angleRing(10,()=>petal(38,102,29,A,W));
        s+=beadRing(260,60,W,4);
      }else if(kind==='temple'){
        s+=angleRing(12,i=>petal(145,284,63,i%3===0?L:i%3===1?P:A,W));

        s+=curls(246,12,W)+ring(148,W,10)+beadRing(146,60,A,5);
        s+=angleRing(12,()=>petal(58,142,35,L,W));
      }else if(kind==='peacock'){
        s+=angleRing(8,i=>petal(122,266,77,i%2?L:P,W));

        s+=curls(239,8,W)+florets(236,4,A);
      }else if(kind==='burst'){
        s+=angleRing(16,i=>petal(143,i%2?244:278,37,[P,A,L,W][i%4],W));
        s+=ring(154,W,10)+ring(135,A,7)+beadRing(151,64,W,5);
        s+=angleRing(8,()=>petal(56,134,38,P,W));s+=florets(247,8,A);
      }
      return s;
    }
    function diya(x,y,scale=1,t=0,c=state.colors){
      const A=c.accent,W=c.border;
      return `<g class="diya-button" transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${scale})" style="cursor:pointer">
        <ellipse cx="0" cy="12" rx="38" ry="12" fill="#38202a" opacity=".15"/>
        <path d="M -35 -1 Q -30 30 0 31 Q 30 30 35 -1 Q 0 7 -35 -1 Z" fill="#a45128" stroke="${A}" stroke-width="4"/>
        <path d="M -36 -2 Q 0 -17 36 -2 Q 0 16 -36 -2 Z" fill="#d78330" stroke="${W}" stroke-width="3"/>
        <ellipse cx="0" cy="-2" rx="23" ry="6" fill="#6c3027"/>
        <path d="M 0 -10 Q -13 -34 -2 -63 Q 14 -42 0 -10 Z" fill="#ffca52" class="flame"/>
        <path d="M 0 -12 Q -5 -29 0 -46 Q 7 -31 0 -12 Z" fill="#fff5be" class="flame"/>
        <ellipse cx="0" cy="-39" rx="24" ry="37" fill="#ffbb57" opacity=".025" filter="url(#softGlow)" class="glimmer"/>
        ${circle(-23,5,2.5,W)}${circle(0,18,2.5,A)}${circle(23,5,2.5,W)}
      </g>`;
    }
    const corners=(c)=>{
      let s='';for(let i=0;i<4;i++){
        const x=i%2?686:74,y=i<2?78:804;
        s+=`<g transform="translate(${x} ${y})">${circle(0,0,38,'none',`stroke="${c.accent}" stroke-width="2" opacity=".38"`)}${circle(0,0,29,'none',`stroke="${c.petal}" stroke-width="2" opacity=".48"`)}${angleRing(8,()=>petal(9,24,9,c.accent,c.border))}</g>`;
      }return s;
    };
    function renderSVG(thumb=false){
      const c=state.colors,kind=TEMPLATES[state.design].kind,n=TEMPLATES[state.design].n;
      const title='Happy Diwali';
      let decorations='';
      // Outer lamps are placed at precise angular intervals; four designs add extra lamps.
      const lampN=['marigold','royal','burst'].includes(kind)?8:4;
      for(let i=0;i<lampN;i++){
        const a=-90+i*360/lampN,xy=pt(306,a);decorations+=diya(xy[0],xy[1],lampN===8?.60:.74,a,c);
      }
      // The SVG is standalone. All gradients, fills and lettering travel with exports.
      return `<svg xmlns="${NS}" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 880" width="760" height="880" role="img" aria-label="Happy Diwali original geometric rangoli">
      <defs>
        <radialGradient id="ground" cx="50%" cy="40%" r="75%"><stop stop-color="${c.bg}"/><stop offset="1" stop-color="${c.bg}"/></radialGradient>
        <radialGradient id="halo"><stop stop-color="${c.accent}" stop-opacity=".09"/><stop offset="1" stop-color="${c.accent}" stop-opacity="0"/></radialGradient>
        <filter id="floorGrain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.34" numOctaves="2" seed="6" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.065"/></feComponentTransfer></filter>
        <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="flameGlow" x="-120%" y="-150%" width="350%" height="400%"><feGaussianBlur stdDeviation=".7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="petalShadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4a1935" flood-opacity=".14"/></filter>
      </defs>
      <rect width="760" height="880" fill="url(#ground)"/>
      <rect width="760" height="880" filter="url(#floorGrain)" opacity=".5"/>
      <rect x="24" y="24" width="712" height="832" rx="2" fill="none" stroke="${c.accent}" stroke-width="1.5" opacity=".35"/>
      <g opacity=".65">${corners(c)}</g>
      <g transform="translate(380 375)">
        ${circle(0,0,316,'url(#halo)')}
        ${ring(287,c.accent,2,'2 13')}
        <g filter="url(#petalShadow)">${makeMotif(kind,c)}</g>
        ${beadRing(31,12,c.border,4)}
        ${circle(0,0,28,c.accent,`stroke="${c.border}" stroke-width="7"`)}
        ${circle(0,0,11,c.petal)}
        ${decorations}
        <g class="glimmer" opacity=".20">${beadRing(294,36,c.accent,2.3)}</g>
      </g>
      <path d="M 240 696 Q 380 678 520 696" stroke="${c.accent}" stroke-width="1.8" fill="none" opacity=".65"/>
      ${circle(231,695,4,c.accent)}${circle(529,695,4,c.accent)}
      <text x="380" y="768" font-size="68" font-family="Georgia, 'Times New Roman',serif" font-style="italic" font-weight="500" letter-spacing="-1.8" text-anchor="middle" fill="${c.ink}">${title}</text>
      <path d="M 286 786 H 359 M 401 786 H 474" stroke="${c.accent}" stroke-width="2.3" opacity=".7"/>${circle(380,786,6,c.accent)}
      </svg>`;
    }
    function templateThumbnail(index){
      const item=TEMPLATES[index],c=PALETTES[index%PALETTES.length],motif=makeMotif(item.kind,c);
      return `<svg viewBox="-310 -310 620 620" aria-hidden="true" role="presentation"><circle r="300" fill="${c.bg}"/>${motif}${circle(0,0,30,c.accent,`stroke="${c.border}" stroke-width="8"`)}</svg>`;
    }
    const palettes=$('paletteList');const templates=$('templateScroller');let toastTimer;
    function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
    function draw(){
      const svg=renderSVG();$('artwork').outerHTML=svg.replace('<svg ','<svg id="artwork" ');
      $('designCounter').textContent=`${String(state.design+1).padStart(2,'0')} / ${TEMPLATES.length}`;
      $('paletteName').textContent=state.palette<0?'Your own mix':PALETTES[state.palette].name;
      [...templates.children].forEach((b,i)=>{b.setAttribute('aria-pressed',String(i===state.design));});
      [...palettes.children].forEach((b,i)=>{b.setAttribute('aria-pressed',String(i===state.palette));});
      $('cardStage').classList.toggle('is-lit',state.lit);
    }
    function sync(){draw();}
    for(let i=0;i<TEMPLATES.length;i++){const t=TEMPLATES[i],btn=document.createElement('button');btn.className='template';btn.type='button';btn.setAttribute('aria-label',`Use ${t.name} design`);btn.innerHTML=templateThumbnail(i)+`<span>${t.name}</span>`;btn.addEventListener('click',()=>{state.design=i;draw();});templates.append(btn);}
    PALETTES.forEach((p,i)=>{const b=document.createElement('button');b.className='swatch';b.type='button';b.title=p.name;b.setAttribute('aria-label',p.name+' palette');b.innerHTML=`<i style="background:${p.petal}"></i><i style="background:${p.accent}"></i>`;b.addEventListener('click',()=>{state.palette=i;state.colors={...p};sync();});palettes.append(b);});
    function hslHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),k=n=>(n+h/30)%12,f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return '#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');}
    function surpriseColors(){const h=Math.random()*360,dark=Math.random()<.18;return {bg:hslHex(h,dark?30:32,dark?17:90),petal:hslHex((h+25)%360,75,47),accent:hslHex((h+158)%360,82,53),leaf:hslHex((h+262)%360,59,40),border:dark?'#fff1de':'#fffaf2',ink:dark?'#f7e3c5':hslHex(h,28,27)};}
    $('randomBtn').addEventListener('click',()=>{let next=Math.floor(Math.random()*TEMPLATES.length);state.design=next===state.design?(next+1)%TEMPLATES.length:next;if(Math.random()<.25){state.palette=Math.floor(Math.random()*PALETTES.length);state.colors={...PALETTES[state.palette]};}else{state.palette=-1;state.colors=surpriseColors();}sync();burst(380,375,35);if(!reduce&&document.querySelector('.card-frame').animate)document.querySelector('.card-frame').animate([{transform:'scale(.988)',opacity:.9},{transform:'scale(1)',opacity:1}],{duration:310,easing:'ease-out'});});
    function urlWithDesign(){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('d',state.design);u.searchParams.set('p',state.palette);for(const k of ['bg','petal','accent','leaf','border','ink']){const v=state.colors[k];if(state.palette<0||PALETTES[state.palette][k]!==v)u.searchParams.set(k,v.slice(1));}return u.toString();}
    function loadQuery(){const q=new URLSearchParams(location.search),d=Number(q.get('d')),p=Number(q.get('p'));if(q.has('d')&&Number.isInteger(d)&&d>=0&&d<TEMPLATES.length)state.design=d;if(q.has('p')&&Number.isInteger(p)&&p>=0&&p<PALETTES.length){state.palette=p;state.colors={...PALETTES[p]};}if(q.get('p')==='-1')state.palette=-1;for(const k of ['bg','petal','accent','leaf','border','ink']){const v=q.get(k);if(v&&/^[0-9a-fA-F]{6}$/.test(v)){state.colors[k]='#'+v;state.palette=-1;}}}
    const svgSource=()=>new XMLSerializer().serializeToString($('artwork'));
    async function pngBlob(){const source=svgSource(),blob=new Blob([source],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('SVG rendering failed'));img.src=url;});const canvas=document.createElement('canvas');canvas.width=1520;canvas.height=1760;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Image export failed')),'image/png'));}finally{URL.revokeObjectURL(url);}}
    function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}
    $('downloadBtn').addEventListener('click',async()=>{try{$('downloadBtn').disabled=true;const b=await pngBlob();downloadBlob(b,'deepam-happy-diwali.png');toast('Your Diwali card has been saved 🪔');}catch(e){toast('Could not save image: '+e.message);}finally{$('downloadBtn').disabled=false;}});
    $('shareBtn').addEventListener('click',async()=>{
      const btn=$('shareBtn');btn.disabled=true;
      try{
        const blob=await pngBlob(),file=new File([blob],'happy-diwali.png',{type:'image/png'}),url=urlWithDesign();
        if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Happy Diwali — DEEPAM',text:'Happy Diwali 🪔'});}
        else if(navigator.share){await navigator.share({title:'Happy Diwali — DEEPAM',text:'Happy Diwali 🪔',url});}
        else{downloadBlob(blob,'deepam-happy-diwali.png');toast('Image saved — share it from your gallery!');}
      }catch(e){if(e?.name!=='AbortError')toast('Sharing unavailable — try Save PNG instead.');}finally{btn.disabled=false;}
    });
    const canvas=$('fxCanvas'),ctx=canvas.getContext('2d');let particles=[],raf=0;const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function sizeCanvas(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);return r;}
    function burst(x,y,count=36){if(reduce)return;const r=sizeCanvas(),cx=x/760*r.width,cy=y/880*r.height,scale=r.width/760;for(let i=0;i<Math.min(count,50);i++){const angle=Math.random()*Math.PI*2,speed=(.4+Math.random()*3.2)*Math.max(.5,scale*1.4);particles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-1.1,age:0,life:35+Math.random()*40,r:1+Math.random()*2.7,color:[state.colors.petal,state.colors.accent,state.colors.leaf,'#ffe6ae'][i%4]});}if(!raf)tick();}
    function tick(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);particles=particles.filter(p=>p.age++<p.life);for(const p of particles){p.vy+=.055;p.vx*=.989;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;ctx.globalAlpha=Math.max(0,1-p.age/p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,2*Math.PI);ctx.fill();}ctx.globalAlpha=1;if(particles.length)raf=requestAnimationFrame(tick);else raf=0;}
    $('cardStage').addEventListener('click',e=>{const box=$('cardStage').getBoundingClientRect();const x=(e.clientX-box.left)/box.width*760,y=(e.clientY-box.top)/box.height*880;burst(x,y,28);});
    // Progressive enhancement: Motion runs only when the CDN is available; SVG/PNG never depend on it.
    (async()=>{try{const {animate}=await import('https://cdn.jsdelivr.net/npm/motion@12/+esm');if(reduce)return;animate('.surprise',{opacity:[0,1],y:[12,0]},{duration:.6,ease:'easeOut'});animate('.card-frame',{opacity:[0,1],scale:[.97,1]},{duration:.9,ease:'easeOut'});}catch(_){/* Offline-friendly CSS/Canvas fallback. */}})();
    if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    loadQuery();sync();
  </script>
